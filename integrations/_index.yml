  status: pending-generation
  arazzo: null
- slug: zuplo-graphql-upstream
  label: Front a GraphQL upstream with a Zuplo edge gateway
  partner: graphql-upstream
  category: Upstream
  use_case: Wrap an internal GraphQL upstream with Zuplo so it gets API key auth, per-consumer rate limits, and
    a REST + MCP surface generated from its schema.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: zuplo-tunnel-private-upstream
  label: Expose a private upstream through a Zuplo tunnel
  partner: tunnel-private-upstream
  category: Networking
  use_case: Use Zuplo tunnels to connect the edge gateway to a private upstream behind a corporate firewall, with
