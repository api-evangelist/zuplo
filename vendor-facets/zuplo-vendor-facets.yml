  catalog_pass_rate: 0.172
  facet: access_clarity
  points: 8
  baseline_pass_rate: 0.44
- feature: monetization-pricing-page
  check: plans_multiple
  layer: composite
  conditional: true
  condition: >-
    Only if the provider publishes three or more plans — Zuplo renders whatever plans exist, it does not
    create tiers.
  catalog_pass_rate: 0.11
  facet: access_clarity
  points: 4
  baseline_pass_rate: 0.325
- feature: monetization-pricing-page
  check: rate_limits_documented
  layer: composite
  provider_must: >-
    Show per-plan quotas/limits on the public Pricing page (or a docs page) so the rate_limits artifact
    can be harvested.
  catalog_pass_rate: 0.145
  facet: operational_transparency
  points: 8
  baseline_pass_rate: 0.438
- feature: rate-limit-policy
  check: rate_limit_signal
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    `verified` reads response headers declared in the provider's OpenAPI; score.rb's RATELIMIT_HEADER_RE
    (/\A(x-)?ratelimit|\Aretry-after\z/i) accepts Retry-After, which the policy emits by default. But
    nothing fetched shows Zuplo writing that header into the spec, so the vendor alone reaches only the
    `documented` fallback; a provider that declares Retry-After on its 429 responses earns `verified`
    itself.
  points: 7
  baseline_pass_rate: 0.381
- feature: mcp-server-handler
  check: mcp_server
  layer: agent_readiness
  grade: templated
  note: >-
    Tools are generated from the provider's own gateway routes and served on the provider's own gateway
    host (custom domain possible), which is `templated` (0.6), not `platform`. It reaches `verified` only
    if the catalog's probe of the provider's mcp/ manifest passes.
  points: 12
  baseline_pass_rate: 0.22
- feature: oauth-protected-resource
  check: protected_resource_metadata
  layer: agent_readiness
  grade: verified
  provider_must: >-
    Register the plugin with the authorization server's issuer and serve it on the host the catalog probes;
    the served document carries both `resource` and `authorization_servers`.
  points: 5
  baseline_pass_rate: 0.133
- feature: oauth-protected-resource
  check: well_known_published
  layer: composite
  provider_must: >-
    Serve the protected-resource document on the provider's own API host so the well-known probe finds
    it; the check accepts a protected-resource doc as one of its four qualifying files.
  catalog_pass_rate: 0.005
  facet: discoverability
  points: 6
  baseline_pass_rate: 0.018
- feature: problem-details
  check: error_semantics
  layer: agent_readiness
  grade: verified
  conditional: true
  condition: >-
    Only if the provider's own OpenAPI $refs a shared problem+json schema across 4xx/5xx responses — the
    gateway returns the envelope at runtime, and Zuplo's docs leave documenting it in the OpenAPI to the
    provider.
  points: 8
  baseline_pass_rate: 0.524
- feature: problem-details
  check: error_responses_documented
  layer: composite
  conditional: true
  condition: Only if the provider's OpenAPI declares 4xx response schemas on at least half its operations.
  catalog_pass_rate: 0.367
  facet: contract_quality
  points: 4
  baseline_pass_rate: 0.621
- feature: llms-export
  check: llms_txt_published
  layer: composite
  credit: 1.0
  note: >-
    Built from the provider's own portal pages and served on the provider's portal domain, so it is authored
    from first-party content (rule 2). It is opt-in (`llmsTxt`), so it only counts once turned on.
  provider_must: >-
    Enable llmsTxt in the Zudoku config; declare an LLMsTxt pointer if the portal is not at the probed
    root.
  catalog_pass_rate: 0.351
  facet: discoverability
  points: 4
  baseline_pass_rate: 0.65
earns_nothing:
- feature: usage-dashboard
  why: Consumer usage analytics are real value to a customer and no check reads them.
- feature: oauth-protected-resource
  check: dynamic_client_registration
  why: >-
    The plugin advertises the resource; DCR needs a registration_endpoint in the authorization server's
    discovery document, which lives at the external IdP, not at Zuplo.
- feature: oauth-protected-resource
  check: auth_clarity
  why: >-
    The `served` grade reads an openid-configuration/oauth-authorization-server document with an issuer
    on the provider's host; Zuplo serves the resource metadata only, and the discovery document is the
    IdP's.
- feature: rate-limit-policy
  check: rate_limits_rich
  why: Enforcing three limits is not documenting them; the check counts limits the provider publishes.
out_of_reach:
  checks:
  - sdk_count_1
  - sdk_count_3
  - cli_present
  - idempotency
  - dry_run_mode
  - reversibility_documented
  - delegated_identity
  - agent_card
  - asyncapi_present
  - webhooks_or_callbacks
  - change_log_present
  - status_page_present
  note: >-
    A gateway and portal cannot ship the provider's SDKs, CLI, event contract or changelog, and idempotency,
    dry-run and reversal are properties of the API behind the gateway.
unscored_practice:
- feature: problem-details
  why: >-
    A uniform RFC 7807 envelope on every gateway-originated error (auth, rate limit, validation) is exactly
    the behaviour error_semantics rewards, yet the score only sees it if the provider writes the schema
    into its own OpenAPI.
- feature: rate-limit-policy
  why: >-
    Retry-After on 429 is the one header an agent needs to back off; no check reads a runtime Retry-After,
    only header declarations in the contract.
