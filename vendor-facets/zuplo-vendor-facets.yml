# Vendor facets — Zuplo. An OpenAPI-native edge gateway with a Zudoku developer portal, Stripe-backed
# monetization, and an MCP server handler that re-invokes gateway routes as tools. The strongest
# gateway on the agent-auth layer: it serves /.well-known/oauth-protected-resource on the customer's
# own gateway host. What it cannot reach: rate-limit headers in the provider's OpenAPI (the policy
# emits Retry-After, which the score accepts only once the provider declares it), SDKs, idempotency, or any discovery document for the authorization server.
vendor: zuplo
name: Zuplo
website: https://zuplo.com
areas:
- developer-portal
- api-gateway
registry_keys:
- zuplo
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Zuplo's lift lands on access clarity and agent readiness: a public pricing page with multiple plans,
  self-serve sign-up and keys, a try-it console, an MCP server generated from the provider's own routes
  on the provider's own gateway host (graded `templated`, 0.6), and a served OAuth protected-resource
  document that also earns the composite .well-known check. The portal only counts once the provider declares
  it in apis.yml, the rate-limit policy emits Retry-After — a header the `verified` grade accepts, but
  only once the provider declares it on its 429 responses in its own OpenAPI — and the RFC 7807 error
  envelope scores only when the provider writes that schema into its own contract.
features:
- id: rate-limit-policy
  name: Rate limiting inbound policy (429 + Retry-After)
  description: >-
    Per-key/per-IP rate limiting at the edge that returns 429 with a Retry-After header by default (headerMode
    retry-after | none).
  source: https://zuplo.com/docs/policies/rate-limit-inbound
  tier: all
- id: mcp-server-handler
  name: MCP Server handler
  description: >-
    Turns configured gateway routes into MCP tools (plus prompts and resources), re-invoked inside the
    gateway and served on the gateway's own route, e.g. https://<gateway>/mcp.
  source: https://zuplo.com/docs/handlers/mcp-server
  tier: all
- id: oauth-protected-resource
  name: OAuthProtectedResourcePlugin
  description: >-
    Registers /.well-known/oauth-protected-resource on the gateway host, returning resource, authorization_servers,
    resource_name and scopes_supported, and adds resource_metadata to 401 WWW-Authenticate.
  source: https://zuplo.com/docs/programmable-api/oauth-protected-resource-plugin
  tier: all
- id: dev-portal
  name: Developer portal (Zudoku) generated from OpenAPI
  description: >-
    Branded portal whose reference is generated from the same OpenAPI that drives the gateway, with MDX
    pages, custom domain via CNAME, IdP sign-in and a Try-it panel that calls the live API.
  source: https://zuplo.com/features/developer-portal
  tier: all
- id: self-serve-keys
  name: Self-serve sign-up and API key management
  description: >-
    Customers sign up, create and roll API keys, and see usage from the portal without contacting the
    provider.
  source: https://zuplo.com/features/developer-portal
  tier: all
- id: try-it
  name: Try-it panel on every operation
  description: An interactive console on each reference operation that calls the live API.
  source: https://zuplo.com/features/developer-portal
  tier: all
- id: monetization-pricing-page
  name: Monetization plugin — public pricing page, subscriptions, usage dashboard
  description: >-
    Adds a Pricing page listing every published plan with feature comparison and prices (visible to unauthenticated
    visitors), plus subscription management, per-plan keys and a quota usage dashboard, billed through
    Stripe.
  source: https://zuplo.com/docs/articles/monetization/developer-portal
  tier: paid
- id: problem-details
  name: RFC 7807 Problem Details on every gateway error
  description: >-
    Built-in policies, handlers and system errors return application/problem+json with type, title, status,
    instance and a trace block; HttpProblems helper for custom handlers.
  source: https://zuplo.com/docs/concepts/api-errors
  tier: all
- id: llms-export
  name: LLM-friendly docs export (llms.txt, llms-full.txt, per-page .md)
  description: >-
    Zudoku builds per-page markdown by default and, opt-in, llms.txt and llms-full.txt from the portal's
    own pages.
  source: https://zuplo.com/docs/dev-portal/zudoku/configuration/llms
  tier: all
- id: usage-dashboard
  name: Consumer usage dashboard
  description: Real-time quota consumption per metered feature for the signed-in customer.
  source: https://zuplo.com/docs/articles/monetization/developer-portal
  tier: paid
